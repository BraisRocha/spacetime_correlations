[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetimecorr"
version = "0.1.0"
description = "Spacetime-correlation analysis tools for UHECR arrival directions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "astropy>=5.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# HEALPix sky-map generation/plotting APIs
skymap = [
  "healpy>=1.18",
]
# Dependencies needed only by the helper scripts in `scripts/`
scripts = [
  "tqdm>=4.65",
]
# Test dependencies
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["spacetimecorr*"]
exclude = ["scripts*", "stc_venv*", "output*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
